version: "3.9"

volumes:
  apk_shared: {}
  turbo-cache: {}

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"

  server-dev:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379
      CHOKIDAR_USEPOLLING: "1"
    command: ["pnpm", "--filter", "backend", "start:dev"]
    volumes:
      - ./apps/backend:/app/apps/backend:delegated
      - ./packages:/app/packages:delegated
      - turbo-cache:/root/.cache/turbo
      - apk_shared:/shared-apk
    ports:
      - "8080:8080"
    profiles: ["dev"]

  client_mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      target: runner
    volumes:
      - apk_shared:/shared-apk

  client_web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    depends_on:
      client_mobile:
        condition: service_started
      server:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - apk_shared:/shared-apk

  client_web-dev:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    depends_on:
      client_mobile:
        condition: service_started
      server-dev:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 8081
      CHOKIDAR_USEPOLLING: "1"
    command:
      ["pnpm", "--filter", "web", "dev", "--", "-p", "8081", "-H", "0.0.0.0"]
    volumes:
      - ./apps/web:/app/apps/web:delegated
      - ./packages:/app/packages:delegated
      - turbo-cache:/root/.cache/turbo
      - apk_shared:/shared-apk
    ports:
      - "8081:8081"
    profiles: ["dev"]
