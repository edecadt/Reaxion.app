volumes:
  apk_shared: {}
  turbo-cache: {}

services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"

  server-dev:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-1}
    command: ["pnpm", "--filter", "backend", "start:dev"]
    volumes:
      - ./apps/backend:/app/apps/backend:delegated
      - ./packages:/app/packages:delegated
      - turbo-cache:/root/.cache/turbo
      - apk_shared:/shared-apk
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    profiles: ["dev"]

  client_mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      target: runner
    volumes:
      - apk_shared:/shared-apk

  client_web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    depends_on:
      client_mobile:
        condition: service_started
      server:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: ${WEB_NODE_ENV:-production}
      PORT: ${WEB_PORT:-8081}
    ports:
      - "${WEB_PORT:-8081}:${WEB_PORT:-8081}"
    volumes:
      - apk_shared:/shared-apk

  client_web-dev:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    depends_on:
      client_mobile:
        condition: service_started
      server-dev:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: ${WEB_PORT:-8081}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-1}
    command:
      [
        "pnpm",
        "--filter",
        "web",
        "dev",
        "--",
        "-p",
        "${WEB_PORT:-8081}",
        "-H",
        "0.0.0.0",
      ]
    volumes:
      - ./apps/web:/app/apps/web:delegated
      - ./packages:/app/packages:delegated
      - turbo-cache:/root/.cache/turbo
      - apk_shared:/shared-apk
    ports:
      - "${WEB_PORT:-8081}:${WEB_PORT:-8081}"
    profiles: ["dev"]
