<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Action REAction Client</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
        background: #f4f4f4;
        margin: 0;
      }
      main {
        background: #fff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        max-width: 640px;
        width: 100%;
      }
      button {
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        border: none;
        border-radius: 4px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      pre {
        margin-top: 1.5rem;
        padding: 1rem;
        background: #111827;
        color: #f9fafb;
        border-radius: 6px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Action REAction Viewer</h1>
      <p>Click the button to fetch the server description.</p>
      <button id="loadButton">Load /about.json</button>
      <pre id="output">Click the button to fetch data.</pre>
    </main>
    <script>
      const button = document.getElementById("loadButton");
      const output = document.getElementById("output");

      button.addEventListener("click", async () => {
        button.disabled = true;
        output.textContent = "Loading...";

        try {
          const response = await fetch("http://localhost:8080/about.json");

          if (!response.ok) {
            throw new Error(`Server responded with ${response.status}`);
          }

          const data = await response.json();
          output.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          output.textContent = `Request failed: ${error.message}`;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
